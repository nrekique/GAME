name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install formatting and lint tools
        run: |
          python -m pip install --upgrade pip
          pip install gdformat godot-lint

      - name: Setup Godot Engine
        uses: firebelley/setup-godot@v2
        with:
          version: '4.0.1'

      - name: Run format and lint script
        run: ./scripts/format_and_lint.sh

      - name: Check for TODO comments
        run: ./scripts/scan_todos.sh

      - name: Run smoke tests
        run: ./tools/run_smoke_suite.sh

      - name: Generate perf CSV + baseline diff report
        run: |
          python ./tools/perf_regression_check.py \
            --output-csv artifacts/perf/portal_stress_current.csv \
            --summary-md artifacts/perf/portal_stress_report.md \
            --raw-log artifacts/perf/portal_stress_raw.log

      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-artifacts
          path: artifacts/perf/
